<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #0d0d0d;
    color: #e6e6e6;
    font-family: 'IBM Plex Mono', monospace;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding: 2rem;
  }

  /* Egg Animation Container */
  .egg-wrapper {
    width: 140px;
    height: 170px;
    position: relative;
    cursor: pointer;
    /* Wobble animation as pecking happens inside */
    animation: egg-wobble 3s infinite ease-in-out;
  }

  .egg-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Detailed Crack Paths */
  .crack-line {
    stroke: #121212;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 120;
    stroke-dashoffset: 120;
    animation: crack-progress 3s infinite ease-in-out;
  }

  .crack-minor {
    stroke: #2a2a2a;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: minor-crack-progress 3s infinite ease-in-out;
  }

  /* Peeking Eye Animation */
  .peeking-eye {
    fill: #f59e0b;
    opacity: 0;
    animation: eye-peek 3s infinite ease-in-out;
  }

  /* Fragment Separation Effect */
  .top-fragment {
    transform-origin: 50px 45px;
    animation: fragment-shift 3s infinite ease-in-out;
  }

  /* Keyframe Animations */
  @keyframes egg-wobble {
    0%, 100% { transform: rotate(0deg); }
    15% { transform: rotate(-8deg) translateX(-2px); }
    25% { transform: rotate(8deg) translateX(2px); }
    35% { transform: rotate(-5deg); }
    45% { transform: rotate(5deg); }
    55%, 90% { transform: rotate(0deg); }
  }

  @keyframes crack-progress {
    0%, 15% {
      stroke-dashoffset: 120;
    }
    45%, 85% {
      stroke-dashoffset: 0;
    }
    100% {
      stroke-dashoffset: 120;
    }
  }

  @keyframes minor-crack-progress {
    0%, 30% {
      stroke-dashoffset: 60;
    }
    55%, 85% {
      stroke-dashoffset: 0;
    }
    100% {
      stroke-dashoffset: 60;
    }
  }

  @keyframes fragment-shift {
    0%, 40% {
      transform: translateY(0px) rotate(0deg);
    }
    60%, 85% {
      transform: translateY(-3px) rotate(-2deg);
    }
    100% {
      transform: translateY(0px) rotate(0deg);
    }
  }

  @keyframes eye-peek {
    0%, 45% {
      opacity: 0;
    }
    55%, 80% {
      opacity: 1;
    }
    95%, 100% {
      opacity: 0;
    }
  }

  /* Header Box for Typewriter Effect */
  .header-box {
    min-height: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  h1 {
    font-size: clamp(1.3rem, 3vw, 2.1rem);
    font-weight: 600;
    letter-spacing: 0.15em;
    color: #f59e0b;
    text-transform: uppercase;
  }

  /* Typewriter Cursor */
  .cursor {
    display: inline-block;
    width: 10px;
    height: 1.1em;
    background-color: #f59e0b;
    vertical-align: middle;
    margin-left: 4px;
    animation: blink 0.8s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  p {
    font-size: 0.9rem;
    color: #888888;
    letter-spacing: 0.05em;
  }

  .dots {
    display: inline-block;
    width: 1.5em;
    text-align: left;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Detailed Egg Animation -->
  <div class="egg-wrapper" title="Something's hatching inside...">
    <svg class="egg-svg" viewBox="0 0 100 130">
      <defs>
        <!-- Soft realistic eggshell gradient -->
        <linearGradient id="eggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="50%" stop-color="#f3f0e6"/>
          <stop offset="100%" stop-color="#c8c4b7"/>
        </linearGradient>

        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
      </defs>

      <!-- Base Egg Shell with Shadow -->
      <path d="M 50 5 C 20 5, 5 45, 5 80 C 5 110, 25 125, 50 125 C 75 125, 95 110, 95 80 C 95 45, 80 5, 50 5 Z" fill="url(#eggGrad)" filter="url(#shadow)" />

      <!-- Peeking Eye inside the central gap -->
      <circle class="peeking-eye" cx="47" cy="58" r="3" />
      <circle class="peeking-eye" cx="48" cy="57" r="1" fill="#ffffff" />

      <!-- Top Fragment shifting upward -->
      <g class="top-fragment">
        <!-- Main Jagged Crack Line -->
        <path class="crack-line" d="M 12 75 L 28 65 L 22 58 L 40 52 L 34 45 L 52 42 L 46 55 L 62 50 L 58 64 L 75 58 L 70 72 L 88 68" />
        
        <!-- Detailed Secondary Spider Cracks -->
        <path class="crack-minor" d="M 28 65 L 32 72 M 40 52 L 44 46 M 52 42 L 50 34 M 62 50 L 68 45 M 58 64 L 64 70" />
      </g>
    </svg>
  </div>

  <!-- Typewriter Header -->
  <div class="header-box">
    <h1><span id="typed-text"></span><span class="cursor"></span></h1>
  </div>

  <p>Come back later<span class="dots" id="dots">.</span></p>
</div>

<script>
  // Typewriter effect for "UNDER CONSTRUCTION"
  const titleText = "UNDER CONSTRUCTION";
  const typedEl = document.getElementById('typed-text');
  let charIndex = 0;

  function typeTitle() {
    if (charIndex < titleText.length) {
      typedEl.textContent += titleText.charAt(charIndex);
      charIndex++;
      setTimeout(typeTitle, 100);
    }
  }

  // Animated Dots Effect
  const dotsEl = document.getElementById('dots');
  let count = 1;
  setInterval(() => {
    count = (count % 3) + 1;
    dotsEl.textContent = '.'.repeat(count);
  }, 500);

  window.addEventListener('load', typeTitle);
</script>

</body>
</html>
