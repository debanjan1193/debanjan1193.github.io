<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Artworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #8a969d;
    color: #ffffff;
    font-family: 'Caveat', cursive;
    min-height: 100vh;
    padding: 2.5rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  /* Top-left header & subtext container */
  header {
    margin-bottom: 2rem;
  }

  h1 {
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.1;
  }

  .subtext {
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    opacity: 0.9;
    margin-top: 0.25rem;
  }

  /* Left-aligned, compact artwork container */
  .artwork-container {
    width: 100%;
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
  }

  /* Drop shadow that conforms to transparent PNG contours */
  .artwork-container img {
    max-width: 380px;
    max-height: 45vh;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0px 12px 18px rgba(0, 0, 0, 0.35));
  }
</style>
</head>
<body>

  <header>
    <h1>My Artworks</h1>
    <p class="subtext">I make my arts on paper and sometime on digital media</p>
  </header>

  <main class="artwork-container">
    <img src="1.png" alt="My Artwork">
  </main>

</body>
</html>
