<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Artworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #8a969d;
    color: #ffffff;
    font-family: 'Caveat', cursive;
    min-height: 100vh;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  /* Top-left header styling */
  header {
    margin-bottom: 2rem;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  /* Centered container for the artwork */
  .artwork-container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .artwork-container img {
    max-width: 90vw;
    max-height: 75vh;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
  }
</style>
</head>
<body>

  <header>
    <h1>My Artworks</h1>
  </header>
  I make my arts on paper and sometime on digital media

  <main class="artwork-container">
    <img src="1.png" alt="My Artwork">
  </main>

</body>
</html>
